[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yume"
version = "0.1.0"
description = "Game development framework — React for RPGs. Build complete games with AI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "kamwoh" }]
keywords = ["game-development", "godot", "rpg", "ai", "framework", "game-generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
yume = "yume.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/yume"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
